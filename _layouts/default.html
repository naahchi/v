<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.category | default: "personal" | capitalize }} {{ page.service | default: "service" | capitalize }} {{ page.city | default: "india" | capitalize }}</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>
  {% include header.html %}
  <main>
      
    {% unless page.disable_main_heading %}
      <h1>{{ page.category | default: "personal" }} service {{ page.city | default: "india" }}</h1>
    {% endunless %}

    {% unless page.disable_search_bar %}
      {% include search.html %}
    {% endunless %}
      
    {{ content }}
  </main>
  {% include footer.html %}
    
<script src="/js/main.js"></script>
</body>
</html>
